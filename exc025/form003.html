<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulário</title>
</head>
<body>
    <h1>teste de formulário</h1>
    <form action="cadastro.php" method="post" autocomplete="on">
        <p>
            <label for="inome">Nome:
                <input type="text" name="nome" id="inome" required maxlength="30" placeholder="Nome completo" autocomplete="name" required>
            </label>
        </p>
        <p>
            <label for="imedia">Média:
                <input type="number" name="media" id="imedia" min="0" max="10"
                placeholder="0 a 10" step="0.1" required>
            </label>
        </p>    
        <p>
            <label for="imes">Périodo letivo:
                <input type="month" name="mes" id="imes">
            </label>
        </p>
        <p>
            <label for="idia">Dia da prova:
                <input type="date" name="dia" id="idia">
            </label>
        </p>
        <p>
            <label for="ihora">Hora da prova:
                <input type="time" name="hora" id="ihora">
            </label>
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
    
</body>
</html>
