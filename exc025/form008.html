<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Teste de formulário</h1>
        <form action="cadastro.php" method="post" autocomplete="on">
            <fieldset>
                <legend>Formulário</legend>
                    <label for="inum1">Primeiro Número:</label> 
                        <input type="number" name="num1" id="inum1" min="0" max="50" required oninput="isoma.innerHTML = Number(inum1.value) + Number(inum2.value)">
            <br>
                    <label for="inum2">Segundo Número:</label>
                        <input type="number" name="num2" id="inum2" min="0" max="50" required oninput="isoma.innerHTML = Number(inum1.value) + Number(inum2.value)">
            <br>        
                    <label for="isoma">Soma:</label>
                        <output name="soma" id="isoma">0</output>

                

            </fieldset>

            <fieldset>
                <legend>Forms com um pouco de JS</legend>
                <p>
                    <label for="inum">Numero:</label>
                        <input type="range" name="num" id="inum" min="0" max="10" oninput="ival.innerHTML = Number(inum.value)">
                            <output id="ival">5</output>              
                </p>
                <p>
                    <label for="iano">En que ano você nasceu?</label>
                        <input type="number" name="ano" id="iano" min="1000" max="2026" oninput="calcIdade()">
                </p>
                <p>
                    <label for="iidade">Sua idade é:</label>
                        <output id="iidae">0</output>
                </p>

                <script>
                    function calcIdade(){
                        let atual = new Date().getFullYear()
                        iidae.innerHTML = Number(atual) - Number(iano.value)
                    }
                </script>

            </fieldset>
            <p>
                <input type="submit" value="Enviar">
                <input type="reset" value="Limpar">
            </p>
         </form>
    
</body>
</html>
