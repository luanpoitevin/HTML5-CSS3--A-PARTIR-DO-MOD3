<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1>Formulário</h1>
    <form action="cadastro.php" method="post" autocomplete="on">
        <fieldset>
            <legend>Dados pessoais</legend>
            <p>
                <label for="inome">Nome:
                    <input type="text" name="nome" id="inome" minlength="5" maxlength="20" required>
                </label>
            </p>
            <p>
                <label for="iemail">Email:
                    <input type="email" name="email" id="iemail" autocomplete="email" required>
                </label>
            </p>
            <p>
                <label for="itel">Telefone:
                    <input type="tel" name="tel" id="itel" autocomplete="tel" pattern="^{2}[0-9]{4}-[0-9]{4} $" required placeholder="(xx)9xxxx-xxxx">
                </label>
            </p>
            <p>
                <input type="submit" value="Enviar">
                <input type="reset" value="Limpar">
            </p>
        </fieldset>
    </form>
</body>
</html>
