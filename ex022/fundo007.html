<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alinhamento vertincal</title>
    <style>
        #container{
            position: relative;
            height:500px ;
            padding: 10px;
            background-color: chartreuse;

        }

        #conteudo{
            position: absolute;
            height: 200px;
            width: 400px;
            background-color: blue;
            left: 50%;
            top: 50%;
            transform: translate(-50% ,-50%);

        }
    </style>
</head>
<body>
    <section id="container">
        <article id="conteudo">

        </article>
    </section>
    
</body>
</html>
