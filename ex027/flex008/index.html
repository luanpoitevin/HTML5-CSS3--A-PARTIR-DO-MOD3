<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Bom</title>
    <style>
        div.container{
            background-color: brown;
            display: flex;
            flex-flow: row wrap;
            align-items: center;
            height:200px;

        }
        div.item{
            background-color: rgb(5, 85, 22);
            border: 1px solid black;
            padding: 20px;
            text-align: center;
        }
        div#i1{
            align-self: auto;
        }
        div#i2{
            align-self: flex-start;
        }
        div#i3{
            align-self: flex-end;
        }
        div#i4{
            align-self: center;
        }
        div#i5{
            align-self: stretch;
        }
        div#i6{
            align-self: flex-start;

        }
        div#i7{
            align-self: center;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="i1">A</div>
        <div class="item" id="i2">B</div>
        <div class="item" id="i3">C</div>
        <div class="item" id="i4">D</div>
        <div class="item" id="i5">E</div>
        <div class="item" id="i6">F</div>
        <div class="item" id="i7">G</div>

    </div>
    
</body>
</html>
